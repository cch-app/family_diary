[project]
name = "family-diary"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "nh3>=0.3.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# B008: idiomatic FastAPI `Depends(...)` as a default argument, not a bug.
# DTZ001/DTZ005/DTZ006: content and backup-filename timestamps are intentionally naive local time.
extend-ignore = ["B008", "DTZ001", "DTZ005", "DTZ006"]
